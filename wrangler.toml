name = "multicast-ip-admin"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 静态页面（public/ 目录）
[assets]
directory = "./public"
binding = "ASSETS"

# 配置存储：先执行 wrangler kv namespace create CONFIG_KV，把返回的 id 填进来
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# 管理员密码不要写在文件里，用：wrangler secret put ADMIN_PASSWORD
# [vars]
# SESSION_TTL_HOURS = "168"
